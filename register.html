<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicVerse - Register</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <h2>ComicVerse</h2>
                <p>Read. Publish. Discover.</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <h3>Create an Account</h3>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-input">
                        <input type="password" id="regPassword" placeholder="Create a password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-input">
                        <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('regConfirmPassword')"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Register</button>
                
                <p class="switch-text">
                    Already have an account? <a href="login.html">Login here</a>
                </p>
            </form>
        </div>
    </div>

    
    <script src="js/auth.js"></script>
</body>
</html>
