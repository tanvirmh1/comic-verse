<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicVerse Admin — User Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="users.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <h2>ComicVerse</h2>
            <p>Admin Panel</p>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html" class="active">User Management</a>
            <a href="content.html">Content Management</a>
            <a href="moderation.html">Moderation</a>
            <a href="announcements.html">Announcements</a>
        </nav>

        <a href="#" class="logout-link">Logout</a>
    </aside>

    <main class="main-content">

        <header class="top-header">
            <h1>User Management</h1>
            <p>Review registered users and approve publisher applications.</p>
        </header>

        <section class="dashboard-section">
            <h2 class="section-title">All Users</h2>

            <div class="filter-bar">
                <button class="filter-btn active-filter" data-filter="all">All</button>
                <button class="filter-btn" data-filter="reader">Readers</button>
                <button class="filter-btn" data-filter="publisher">Publishers</button>
                <button class="filter-btn" data-filter="suspended">Suspended</button>
            </div>

            <div class="table-wrap">
                <table class="data-table" id="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-tbody">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="dashboard-section">
            <h2 class="section-title">Publisher Applications</h2>

            <div class="table-wrap">
                <table class="data-table" id="application-table">
                    <thead>
                        <tr>
                            <th>Applicant</th>
                            <th>Email</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="app-tbody">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="users.js"></script>

</body>
</html>
