<body>
  <header class="site-header">
    <a class="brand" href="index.html">ComicVerse</a>
    <nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="comics.html">Comics</a><a class="active" href="novels.html">Novels</a><a href="genres.html">Genres</a></nav>
    <form class="search-form" id="searchForm" role="search"><input id="searchInput" type="search" placeholder="Search series..." aria-label="Search series"></form>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>

    <div class="collection-toolbar">
      <span class="result-count" id="collectionCount">Loading titles...</span>

    </div>
    <div class="filter-chips" id="collectionFilters">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="Action">Action</button>
      <button class="filter-chip" data-filter="Fantasy">Fantasy</button>
      <button class="filter-chip" data-filter="Adventure">Adventure</button>
      <button class="filter-chip" data-filter="Romance">Romance</button>
      <button class="filter-chip" data-filter="Mystery">Mystery</button>
      <button class="filter-chip" data-filter="Sci-Fi">Sci-Fi</button>

    <div class="collection-grid" id="collectionGrid"></div>

  </main>
  <footer class="site-footer">© 2026 ComicVerse · Your next adventure starts here.</footer>
