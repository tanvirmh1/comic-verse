<div class="series-section">
    <div class="page-header flex-between">
        <div>
            <h1>Series Management</h1>
            <p>Create, edit and delete your series.</p>
        </div>
        <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Create New Series</button>
    </div>
    <div class="card table-container">
        <table id="seriesTable">
            <thead>
                <tr><th>Title / Genres</th><th>Type</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Shadow Realm Chronicles</strong><br><span style="font-size:12px;color:gray;">Action, Fantasy</span></td>
                    <td>Comic</td>
                    <td><span class="badge badge-success">Approved</span></td>
                    <td>
                        <button class="btn-icon"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon text-danger" onclick="this.closest('tr').remove()"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="seriesModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom:20px;">Create New Series</h2>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="newSeriesTitle" placeholder="Series Title">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="newSeriesType"><option>Comic</option><option>Novel</option></select>
            </div>
            <button class="btn-primary" onclick="addNewSeries()">Save Series</button>
        </div>
    </div>
</div>
