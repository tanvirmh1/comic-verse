<div class="upload-section">
    <div class="page-header">
        <h1>Chapter Upload</h1>
        <p>Upload comic chapters (images) or novel chapters (text).</p>
    </div>
    <div class="card form-card">
        <div class="form-row">
            <div class="form-group" style="flex:1">
                <label>Select Series</label>
                <select>
                    <option>Shadow Realm Chronicles</option>
                </select>
            </div>
            <div class="form-group" style="flex:1">
                <label>Chapter Number</label>
                <input type="number" placeholder="e.g. 46">
            </div>
        </div>
        
        <div class="form-group">
            <label>Content Type</label>
            <div class="radio-group">

                <label><input type="radio" name="contentType" onclick="toggleUploadType('comic')" checked> Comic (Images)</label>
                <label><input type="radio" name="contentType" onclick="toggleUploadType('novel')"> Novel (Text)</label>
            </div>
        </div>


        <div id="comic-upload" class="form-group">
            <div class="upload-area">
                <i class="fas fa-images"></i>
                <p>Drag & drop images here</p>
                <button type="button" class="btn-secondary">Browse Files</button>
            </div>
        </div>


        <div id="novel-upload" class="form-group hidden">
            <label>Chapter Text</label>

            <textarea rows="8" placeholder="Paste your novel chapter text here..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group" style="flex:1">
                <label>Release Schedule</label>
                <select id="releaseSchedule" onchange="toggleScheduleDate()">
                    <option value="draft">Draft</option>
                    <option value="immediate">Immediate</option>
                    <option value="schedule">Schedule Date</option>
                </select>
            </div>
            <!-- Date Picker (Hidden by default) -->
            <div class="form-group hidden" id="datePicker" style="flex:1">
                <label>Date & Time</label>
                <input type="datetime-local">
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-primary" onclick="alert('Submitted for approval!')">Submit for Approval</button>
        </div>
    </div>
</div>
