<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicVerse - Publisher Dashboard</title>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Feature Specific CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/series.css">
    <link rel="stylesheet" href="css/upload.css">
    <link rel="stylesheet" href="css/chapters.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/comments.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Persistent Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <h2>ComicVerse</h2>
                <span>PUBLISHER PANEL</span>
            </div>
            <nav class="menu" id="sidebarMenu">
                <a href="pages/dashboard.html" class="nav-link active" data-target="dashboard"><i class="fas fa-home"></i> Dashboard</a>
                <a href="pages/series.html" class="nav-link" data-target="series"><i class="fas fa-book"></i> Series Management</a>
                <a href="pages/upload.html" class="nav-link" data-target="upload"><i class="fas fa-upload"></i> Chapter Upload</a>
                <a href="pages/chapters.html" class="nav-link" data-target="chapters"><i class="fas fa-layer-group"></i> Manage Chapters</a>
                <a href="pages/analytics.html" class="nav-link" data-target="analytics"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="pages/comments.html" class="nav-link" data-target="comments"><i class="fas fa-comments"></i> Reader Comments</a>
            </nav>
            <div class="logout-container">
                <button class="btn-logout" onclick="alert('Logged out')"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <!-- Dynamic Content Area -->
        <main class="main-content" id="mainContent">
            <div style="display:flex; justify-content:center; align-items:center; height:100%;">
                <h2>Loading Dashboard...</h2>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
